{% extends 'base.html' %}

{% block content %}
<style>
    .login-wrapper {
        display: flex; align-items: center; justify-content: center;
        min-height: calc(100vh - 250px);
    }
    .login-card {
        width: 100%; max-width: 420px; background: white; padding: 48px 40px;
        border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.06);
        border: 1px solid var(--border, #e8ecef);
    }
    .login-card h2 {
        text-align: center; color: var(--primary, #009688); margin: 0 0 8px;
        font-weight: 800; font-size: 1.6rem;
    }
    .login-subtitle {
        text-align: center; color: #999; font-size: 0.92rem; margin-bottom: 32px;
    }
    .login-error {
        background: #ffebee; color: #c62828; padding: 14px 18px; border-radius: 12px;
        margin-bottom: 24px; font-size: 0.9rem; text-align: center; font-weight: 600;
        border: 1px solid #ffcdd2; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-field { margin-bottom: 22px; }
    .login-field label {
        display: block; margin-bottom: 8px; font-weight: 700; color: #444;
        font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .login-field input {
        width: 100%; padding: 14px 16px; border: 2px solid #e8ecef; border-radius: 12px;
        font-size: 1rem; box-sizing: border-box; transition: 0.2s;
        font-family: inherit; background: #fafbfc;
    }
    .login-field input:focus {
        border-color: var(--primary, #009688); outline: none;
        box-shadow: 0 0 0 4px rgba(0,150,136,0.1); background: white;
    }
    .login-forgot {
        text-align: right; margin-bottom: 28px;
    }
    .login-forgot a {
        color: var(--primary, #009688); font-size: 0.88rem; text-decoration: none;
        font-weight: 600; transition: 0.2s;
    }
    .login-forgot a:hover { text-decoration: underline; }
    .login-btn {
        width: 100%; background: linear-gradient(135deg, var(--primary, #009688), var(--primary-dark, #00796b));
        color: white; padding: 16px; border: none; border-radius: 50px;
        font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.3s;
        font-family: inherit; letter-spacing: 0.5px;
    }
    .login-btn:hover {
        transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,150,136,0.3);
    }
    .login-register {
        text-align: center; margin-top: 24px; font-size: 0.92rem; color: #888;
    }
    .login-register a {
        color: var(--primary, #009688); font-weight: 700; text-decoration: none;
    }
    .login-register a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
        .login-wrapper { min-height: calc(100vh - 180px); }
        .login-card { padding: 32px 22px; border-radius: 16px; }
        .login-card h2 { font-size: 1.35rem; }
        .login-subtitle { font-size: 0.85rem; margin-bottom: 24px; }
        .login-field input { padding: 13px 14px; font-size: 0.95rem; }
        .login-btn { padding: 14px; font-size: 0.95rem; }
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Bem-vindo de volta!</h2>
        <p class="login-subtitle">Acesse sua conta para ver as vagas</p>

        <form method="POST">
            {% csrf_token %}

            {% if form.errors %}
                <div class="login-error">
                    <i class="material-icons" style="font-size:18px;">error_outline</i>
                    Usuário ou senha incorretos.
                </div>
            {% endif %}

            <div class="login-field">
                <label>Usuário / E-mail</label>
                <input type="text" name="username" placeholder="Digite seu e-mail ou usuário" required autofocus>
            </div>

            <div class="login-field">
                <label>Senha</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="login-forgot">
                <a href="{% url 'password_reset' %}">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="login-btn">ENTRAR</button>
        </form>

        <div class="login-register">
            Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </div>
    </div>
</div>
{% endblock %}
